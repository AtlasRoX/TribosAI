<!doctype html>
<html lang="en">
<head>
{{> head}}
</head>
<body class="min-h-dvh overflow-x-hidden">
{{> nav}}

<main id="main">
  <section class="relative pt-32 pb-12 sm:pt-40">
    <div class="mx-auto max-w-4xl px-5 sm:px-8">
      <h1 class="rise display text-[clamp(3rem,8vw,6rem)] leading-[0.95]" style="animation-delay:.15s">Every step of the <em>worn path</em>.</h1>
      <p class="rise mt-6 max-w-2xl text-lg leading-relaxed text-sand" style="animation-delay:.3s">What changed in Tribos, release by release.</p>
      <nav class="rise mt-8 flex flex-wrap gap-2" style="animation-delay:.45s" aria-label="Versions">
{{version_links}}
      </nav>
    </div>
  </section>

  <section class="mx-auto max-w-4xl px-5 pb-28 sm:px-8">
    <ol class="relative border-l border-smoke">
{{changelog}}
    </ol>
  </section>
</main>

{{> footer}}
</body>
</html>
