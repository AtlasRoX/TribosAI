# Auto-labeling configuration for PRs based on files changed

# Documentation changes
documentation:
  - changed-files:
    - any-glob-to-any-file: ['docs/**', '*.md', 'mkdocs.yml']

# CI/CD changes
ci:
  - changed-files:
    - any-glob-to-any-file: ['.github/**', 'pyproject.toml', 'uv.lock']

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file: ['pyproject.toml', 'uv.lock']

# Specialist agents
archivon:
  - changed-files:
    - any-glob-to-any-file: ['tribos/archivon/**']

axiom:
  - changed-files:
    - any-glob-to-any-file: ['tribos/axiom/**']

dynamis:
  - changed-files:
    - any-glob-to-any-file: ['tribos/dynamis/**']

physis:
  - changed-files:
    - any-glob-to-any-file: ['tribos/physis/**']

# Image input (OCR and vision models)
vision:
  - changed-files:
    - any-glob-to-any-file: ['tribos/vision/**']

# Tests
tests:
  - changed-files:
    - any-glob-to-any-file: ['**/tests/**', '**/test_*.py', '**/*_test.py']

# Docker
docker:
  - changed-files:
    - any-glob-to-any-file: ['docker/**', '**/Dockerfile*', '**/docker-compose*.yml']

# Frontend (the Next.js web app)
frontend:
  - changed-files:
    - any-glob-to-any-file: ['web/**']

# FastAPI backend
backend:
  - changed-files:
    - any-glob-to-any-file: ['app/backend/**']

# Shared pipeline: orchestrator, planner, agentic runtime, verifier, tools, memory, configuration
core:
  - changed-files:
    - any-glob-to-any-file: ['tribos/agents/**', 'tribos/agentic/**', 'tribos/verify/**', 'tribos/tools/**', 'tribos/utils/**', 'tribos/sources/**', 'tribos/extensions/**', 'tribos/config/**']

# Datasets, provenance, export and evaluation
data-provenance:
  - changed-files:
    - any-glob-to-any-file: ['tribos/datasets/**', 'tribos/provenance/**', 'tribos/export/**', 'tribos/evals/**']
