# Top-level regression suite: everything under tests/ (auth and tenant isolation, datasets, exports,
# streaming, the specialist agents, scientific validation and the audit regression cases), with a coverage gate,
# plus ruff on the core packages.
name: TESTS Core

on:
  pull_request:
    branches: [main, master]
    paths:
      - "tribos/**"
      - "docker/**"
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests_scientific_validation.yml"
  push:
    branches: [main, master]
    paths:
      - "tribos/**"
      - "docker/**"
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests_scientific_validation.yml"
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

jobs:
  core-tests:
    name: Core tests (tests/)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Network cases (@pytest.mark.network) stay skipped: TRIBOS_LIVE_TESTS is not set here.
      # Coverage scope comes from [tool.coverage.run] in pyproject.toml (source = tribos).
      - name: Run tests/ with coverage
        run: uv run coverage run -m pytest tests/ -q --durations=10

      # Measured 78% (41,167 statements) on 2026-10-17; the gate sits 2 points below so platform-specific
      # branches do not flake it. Raise it as coverage grows; never lower it to make a PR pass.
      - name: Coverage report and gate
        run: uv run coverage report --skip-covered --sort=cover --fail-under=76

      - name: Coverage XML
        if: always() && matrix.os == 'ubuntu-latest'
        run: uv run coverage xml -o coverage-core.xml

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-core
          path: coverage-core.xml
          if-no-files-found: ignore

  lint:
    name: Ruff (core packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Blocking: syntax errors, undefined names and other pyflakes errors that break at runtime (clean today).
      - name: Ruff (runtime errors, blocking)
        run: >-
          uv run ruff check --select E9,F63,F7,F82 --output-format=github
          tribos/agents tribos/agentic tribos/tools app tests

      # Report only: the full [tool.ruff.lint] rule set had ~2,900 pre-existing findings on 2026-10-17 (mostly
      # UP006/UP045 annotation style, autofixable). Drop --exit-zero once `ruff check --fix` has been applied.
      - name: Ruff (full rule set, report only)
        run: >-
          uv run ruff check --exit-zero --statistics
          tribos/agents tribos/agentic tribos/tools app tests

  type-check:
    name: Mypy (new modules)
    runs-on: ubuntu-latest
    # The first step is blocking; the report-only step below carries its own continue-on-error, so the job
    # itself fails when the enforced modules regress (AUDIT-115).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Blocking (AUDIT-115): strict mypy, with the [tool.mypy] settings and the per-module stub overrides in
      # pyproject.toml, on the modules that pass it today. --follow-imports=silent still reads the modules they
      # import for their types but reports errors only in the listed paths. Add a module here once it is clean;
      # never remove one to make a PR pass.
      - name: Mypy strict (enforced modules, blocking)
        run: >-
          uv run mypy --follow-imports=silent
          tribos/agentic/research tribos/vision tribos/axiom/accuracy.py
          tribos/export/thesis.py tribos/export/svgchart.py tribos/verify/formal/runner.py
          tribos/agentic/sandbox/policy.py tribos/agentic/sandbox/gateway.py

      # Report only: strict mypy has never been enforced on the rest of the codebase (617 errors in 133 files on
      # 2026-11-04). Move modules into the blocking step above as they become clean.
      - name: Run mypy
        continue-on-error: true
        run: >-
          uv run mypy --ignore-missing-imports
          tribos/agents tribos/axiom tribos/dynamis tribos/physis tribos/archivon
          tribos/provenance tribos/export tribos/datasets
