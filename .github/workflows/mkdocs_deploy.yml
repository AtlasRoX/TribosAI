name: mkdocs-deploy
# GitHub Pages: the homepage (website/) at the site root and the documentation (MkDocs) under /docs/.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tribos/**"
      - "pyproject.toml"
      - "website/**"
      - "CHANGELOG.md"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies (including MkDocs)
        run: uv sync --frozen --extra docs

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache MkDocs materials
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: mkdocs-material-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          path: .cache
          restore-keys: |
            mkdocs-material-${{ runner.os }}-

      - name: Build the homepage
        run: |
          cd web && npm ci && cd ..
          node website/build.mjs

      - name: Build the documentation
        run: uv run mkdocs build --clean --site-dir site-docs

      - name: Deploy to GitHub Pages
        run: |
          rm -rf pages && mkdir pages
          cp -r website/dist/. pages/
          mkdir pages/docs && cp -r site-docs/. pages/docs/
          touch pages/.nojekyll
          uv run ghp-import --no-jekyll --push --force --message "Deploy the homepage and documentation" pages
