name: Docker Build and Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build, for example v1.48.2"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two images docker/compose.yml builds: the API (context = repository root) and the web app (context = web/).
        include:
          - image: tribos-backend
            dockerfile: docker/backend.Dockerfile
            context: .
          - image: tribos-web
            dockerfile: docker/web.Dockerfile
            context: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          sudo docker system prune -af || true
          sudo docker builder prune -af || true

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE || 'vpatientengine' }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_NAMESPACE || 'vpatientengine' }}/${{ matrix.image }}:latest
