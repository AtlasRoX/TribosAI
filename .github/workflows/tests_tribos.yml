# Modern CI workflow using uv for fast, reliable dependency management
name: TESTS Tribos

on:
  pull_request:
    branches: [main, master]
    paths:
      - "tribos/tribos/**"
      - "tribos/vivarix/**"
      - "tribos/synapta/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main, master]
    paths:
      - "tribos/tribos/**"
      - "tribos/vivarix/**"
      - "tribos/synapta/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

jobs:
  # Code quality checks. pylint and ruff report without blocking: this legacy module had pre-existing
  # findings (ruff: dozens to hundreds per module on 2026-10-17). Bandit blocks.
  quality-checks:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run pylint (report only)
        continue-on-error: true
        run: uv run pylint tribos/tribos

      - name: Run ruff linting (report only)
        continue-on-error: true
        run: uv run ruff check tribos/tribos

      - name: Run bandit security scan
        run: uv run bandit -c pyproject.toml -r tribos/tribos

  # Cross-platform testing
  test-matrix:
    name: Tests
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: |
          uv run coverage run --include=tribos/tribos/* -m pytest --cache-clear tribos/tribos/tests/

      - name: Generate coverage report
        run: |
          uv run coverage report -m --include="tribos/tribos/*"
          uv run coverage xml --include="tribos/tribos/*" -o coverage-tribos.xml

      - name: Check coverage threshold
        shell: bash
        run: |
          # --include: [tool.coverage.run] source=tribos overrides `coverage run --include`, so an unfiltered
          # TOTAL is the whole package. Measured 4% for tribos/tribos on 2026-10-17 (tribos/tribos/tests has 8 tests for the legacy Streamlit orchestrator);
          # the gate sits 2 points below. The old COVERAGE_MIN=100 could never pass. Raise it as tests land.
          TOTAL_COVERAGE=$(uv run coverage report --include="tribos/tribos/*" | awk 'END {print int($NF)}')
          COVERAGE_MIN=2
          if [[ $TOTAL_COVERAGE -lt $COVERAGE_MIN ]]; then
            echo "Code coverage $TOTAL_COVERAGE% is below $COVERAGE_MIN%. Please check the coverage report."
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage-tribos.xml
          flags: tribos
          name: tribos-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
