# Modern CI workflow using uv for fast, reliable dependency management
name: TESTS Tribos

on:
  pull_request:
    branches: [main, master]
    paths:
      - "tribos/**"
      - "app/**"
      - "tests/**"
      - "scripts/gen_env_reference.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests_tribos.yml"
  push:
    branches: [main, master]
    paths:
      - "tribos/**"
      - "app/**"
      - "tests/**"
      - "scripts/gen_env_reference.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests_tribos.yml"
  workflow_dispatch:

# The offline suite needs no keys: tests/conftest.py removes every key-like variable and blocks non-loopback
# network access; @pytest.mark.network cases only run with TRIBOS_LIVE_TESTS=1.

jobs:
  # Code quality checks. Blocking: ruff's pyflakes (F) and syntax (E9) rules, bandit at high severity, and the
  # generated environment reference (every TRIBOS_* the code reads must be a registered setting, and
  # docs/configuration.md / .env.example must match the registry). pylint and the full ruff rule set only report:
  # the code base still has legacy findings (3.4k E501 alone).
  quality-checks:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff (pyflakes and syntax errors)
        run: uv run ruff check --select F,E9 tribos app tests

      - name: Run ruff, all configured rules (report only)
        continue-on-error: true
        run: uv run ruff check tribos app

      - name: Run pylint (report only)
        continue-on-error: true
        run: uv run pylint tribos app

      - name: Run bandit security scan (high severity blocks)
        run: uv run bandit -c pyproject.toml -r tribos app --severity-level high

      - name: Run bandit, all severities (report only)
        continue-on-error: true
        run: uv run bandit -c pyproject.toml -r tribos app

      - name: Check the environment reference and the settings registry
        run: uv run python scripts/gen_env_reference.py --check

  # Cross-platform testing
  test-matrix:
    name: Tests
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # --source/--omit on the command line override [tool.coverage.run] (source = tribos, omit = app/*), so the
      # API package is measured too.
      - name: Run tests with coverage
        run: uv run coverage run --source=tribos,app --omit="*/tests/*" -m pytest --cache-clear tests/

      - name: Generate coverage report
        run: |
          uv run coverage report
          uv run coverage xml -o coverage-tribos.xml

      - name: Check coverage threshold
        shell: bash
        run: |
          # Measured 79% (tribos + app, tests/ offline suite) on 2026-10-25; the gate sits a few points below so
          # platform-specific skips (OCR models, sandbox limits) do not fail it. Raise it as tests land.
          TOTAL_COVERAGE=$(uv run coverage report | awk '/^TOTAL/ {print int($NF)}')
          COVERAGE_MIN=75
          if [[ -z "$TOTAL_COVERAGE" || $TOTAL_COVERAGE -lt $COVERAGE_MIN ]]; then
            echo "Code coverage ${TOTAL_COVERAGE:-unknown}% is below $COVERAGE_MIN%. Please check the coverage report."
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-tribos.xml
          flags: tribos
          name: tribos-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
