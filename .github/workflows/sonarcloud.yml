# SonarCloud code quality analysis workflow
name: SonarCloud Analysis

on:
  pull_request:
    branches: [main, master]
    paths:
      - "tribos/**"
      - "pyproject.toml"
      - "uv.lock"
      - "sonar-project.properties"
      - ".github/workflows/sonarcloud.yml"
  push:
    branches: [main, master]
    paths:
      - "tribos/**"
      - "pyproject.toml"
      - "uv.lock"
      - "sonar-project.properties"
      - ".github/workflows/sonarcloud.yml"
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate SonarCloud reports
        shell: bash
        run: |
          set -euo pipefail

          # One package (tribos) plus the API (app); the old per-module layout (tribos/<module>/tests) is gone.
          uv run bandit -c pyproject.toml -r tribos app -f json -o bandit-tribos.json || true
          uv run pylint tribos app --output-format=json --reports=no > pylint-tribos.json || true
          uv run coverage run --data-file=.coverage.core --source=tribos,app --omit="*/tests/*" -m pytest --cache-clear tests/
          uv run coverage xml --data-file=.coverage.core -o coverage-core.xml

      - name: Read project version
        id: version
        shell: bash
        run: echo "version=$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
