# SonarCloud project configuration
sonar.projectKey=AtlasRoX_tribos-CS
sonar.organization=atlasrox

# Project metadata
sonar.projectName=Tribos
# projectVersion is passed by the workflow from pyproject.toml (sonar.projectVersion).
sonar.projectDescription=Multi-agent research assistant for engineering, physics and the mathematical sciences.

# Source code configuration
sonar.sources=tribos,app
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py
sonar.exclusions=**/tests/**,docs/**,**/__pycache__/**,**/*.pyc,**/.venv/**,**/*.egg-info/**,**/.DS_Store,**/.env,**/.coverage,**/docker-compose/**,**/README.md,**/install.md,**/Dockerfile,**/entrypoint.sh,**/build/**,**/dist/**

# Python specific settings
sonar.python.version=3.12

# Coverage settings
sonar.python.coverage.reportPaths=coverage-core.xml

# External reports
sonar.python.pylint.reportPaths=pylint-tribos.json
sonar.python.bandit.reportPaths=bandit-tribos.json

# Code analysis settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Quality gate settings
sonar.qualitygate.wait=true

# Duplication detection
sonar.cpd.python.minimumTokens=50
sonar.cpd.exclusions=**/__init__.py,**/states/**,**/configs/**

# Additional exclusions for generated or vendor code
sonar.coverage.exclusions=**/tests/**,docs/**
