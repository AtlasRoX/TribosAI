site_name: Tribos
site_description: Your research partner for engineering and science.
site_url: https://github.com/AtlasRoX/TribosAI
repo_name: AtlasRoX/TribosAI
repo_url: https://github.com/AtlasRoX/TribosAI

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/logo.png

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Architecture & Reasoning:
      - Agentic System Architecture: agentic/README.md
      - Auto-Routing: agentic/auto-routing.md
      - Reasoning Loop & References: agentic/references-agent-loop.md
      - Verification & Tools: agentic/references-verification-tools-data.md
      - Platform API: agentic/platform-api.md
      - Sandbox Security: agentic/sandbox-security.md
  - Specialist Agents:
      - Archivon (Literature & Theorems): archivon/index.md
      - Axiom (Symbolic Mathematics): axiom/index.md
      - Dynamis (Dynamics & Simulation): dynamis/index.md
      - Calcula (Computation & Data): calcula/index.md
      - Physis (Physical & Materials Reference): physis/index.md
  - Configuration Reference: configuration.md
  - Evaluation Harness: evals.md
  - Developer & Operations:
      - Developer Setup: developer/README.md
      - Testing & Linting: developer/TESTING_LINTING.md
      - Workflows & CI: developer/WORKFLOWS.md
      - Cloud Deployment: cloud/CLOUD_DEPLOYMENT.md
      - Azure Deployment: developer/AZURE_DEPLOYMENT.md
      - SonarCloud Setup: developer/SONARCLOUD_SETUP.md
  - Contributing: CONTRIBUTING.md
