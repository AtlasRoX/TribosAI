[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribos"
description = "Engineering and scientific R&D assistant for mathematics, physics and engineering."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "h5py==3.14.0",
  "httpx==0.28.1",
  "huggingface_hub==0.34.4",
  "langchain==0.3.30",
  "langchain-core==0.3.86",
  "langchain-openai==0.3.0",
  "matplotlib==3.10.6",
  "cvxpy==1.7.5",
  "mpmath==1.3.0",
  "networkx==3.5",
  "numpy==1.26.4",
  "openai==1.59.6",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pint==0.26.2",
  "pydantic==2.11.9",
  "PyJWT==2.15.0",
  "pypdf==6.21.4",
  "python-flint==0.9.0",
  "scikit-fem==10.0.2",
  "requests==2.33.0",
  "scipy==1.16.2",
  "sentence_transformers==3.3.1",
  "sympy==1.14.0",
  "tabulate==0.9.0",
  "torch==2.10.0",
  "tqdm==4.67.1",
  "transformers==4.55.2",
  "xlsxwriter==3.2.9",
  "pyarrow==26.0.0",
  "beautifulsoup4==4.14.2",
  "python-dotenv>=1.0.0",
  "python-multipart==0.0.32",
  "python-docx==1.2.0",
  "fpdf2==2.8.9",
  "markdown-it-py==4.0.0",
  "mem0ai>=0.1.0",
  "playwright==1.60.0",
]
version = "1.1.0"

[project.scripts]
tribos-eval = "tribos.evals.cli:main"

[project.optional-dependencies]
dev = [
  "coverage==7.10.7",
  "ipykernel==6.30.1",
  "ipython==8.32.0",
  "pylint==3.3.8",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.1",
  "setuptools==84.1.0",
  "ruff==0.13.2",
  "mypy==1.18.2",
  "bandit==1.8.6",
  "pip-audit==2.9.0",
  "safety==3.6.2",
  "pre-commit==4.3.0",
  "twine==6.2.0",
  "python-semantic-release==10.5.3",
]
# Image input (questions as photos or scans): Indra OCR on the CPU. opencv is pinned below 4.11 because later
# wheels require numpy 2, and numpy is pinned to 1.26 above.
vision = [
  "indra-ocr==1.1.2",
  "opencv-python-headless==4.10.0.84",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-include-markdown-plugin==7.2.0",
  "mkdocs-material==9.8.0",
  "mkdocstrings==0.30.1",
  "mkdocstrings-python==1.18.2",
]

[tool.uv]
# Minimum versions for transitive dependencies with published security advisories (AUDIT-009, AUDIT-109). Remaining
# advisories (langchain, langchain-core, langchain-text-splitters and langchain-openai 0.3, transformers 4.x,
# sentence-transformers 3.x, torch 2.10, mem0ai 0.1, pylint 3, pytest 8) need major upgrades that change APIs Tribos
# uses, the numpy 1.26 pin or the CUDA 12 torch wheels; they are tracked in AUDIT_REPORT.md.
# Upper bounds: filelock is held at 3.20.3 because every later 3.x release carries more advisories (fixed only in
# 4.x) and safety 3.6 caps filelock < 4. That keeps virtualenv (dev, via pre-commit) on 20.36: 20.38+ needs
# filelock >= 3.24.2 and 21.14.6+ needs packaging >= 26, which langchain-core 0.3 forbids. langsmith stays below 0.12
# (0.12 moves to the httpx2 client stack), marshmallow below 4 (major) and pymdown-extensions below 12 (12.0
# rewrites emphasis parsing).
constraint-dependencies = [
  "aiohttp>=3.14.4",
  "anyio>=4.14.2",
  "authlib>=1.9.1",
  "certifi>=2026.10.19",
  "cryptography>=50.0.0",
  "filelock==3.20.3",
  "fonttools>=4.60.2",
  "fsspec>=2026.6.0",
  "gitpython>=3.2.1",
  "idna>=3.15",
  "jaraco-context>=6.1.0",
  "langchain-text-splitters>=0.3.9",
  "langsmith>=0.8.18,<0.12",
  "lxml>=6.1.0",
  "marshmallow>=3.26.2,<4",
  "msgpack>=1.2.3",
  "nltk>=3.10.3",
  "orjson>=3.11.5",
  "pillow>=13.0.0",
  "pip>=26.2",
  "pygments>=2.20.0",
  "pymdown-extensions>=11.0.1,<12",
  "soupsieve>=2.9.0",
  "tornado>=6.6",
  "urllib3>=2.8.0",
  "virtualenv>=20.36.1",
]

[tool.semantic_release]
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
version_toml = [
  "pyproject.toml:project.version",
]
commit_parser = "conventional"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true


[tool.hatch.build.targets.wheel]
packages = ["tribos"]
exclude = [
  "tribos/synapta/tests/files",
  "tribos/synapta/tests/files/**/*",
  "tribos/**/tests/files/**/*",
  "dist/*",
  ".venv/*",
  "node_modules/*",
]


[tool.hatch.build.targets.sdist]
exclude = [
  "tribos/synapta/tests/files",
  "tribos/synapta/tests/files/**/*",
  "tribos/**/tests/files/**/*",
  "dist/*",
  ".venv/*",
  "node_modules/*",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration tests",
  "unit_mock: marks tests that are fully mocked and avoid external resources",
  "network: calls live upstream APIs or the configured LLM; skipped unless TRIBOS_LIVE_TESTS=1",
  "live: end-to-end against a running backend or real model; run only on demand",
  "slow: takes more than a few seconds offline; deselect with -m 'not slow'",
]

[tool.pylint.MASTER]
extension-pkg-allow-list = ["pcst_fast"]

[tool.pylint.messages_control]
disable = ["R0801", "R0902", "W0221", "W0122"]

[tool.pylint.format]
max-module-lines = 2000

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line length: enforced by review, not a gate (3.4k legacy violations)
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402", "B904", "E741"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["setuptools.*", "pkg_resources.*"]
ignore_missing_imports = true

# Third-party modules the strictly checked modules import that ship no type information (no py.typed, no stubs in the
# lock), and the optional `vision` extra (cv2, indra_ocr, pypdfium2), which CI does not install (AUDIT-115).
[[tool.mypy.overrides]]
module = ["sympy.*", "mpmath.*", "scipy.*", "psutil.*", "cv2.*", "indra_ocr.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "test_*"]
skips = [
  "B101",
  "B601",
  "B404",
  "B607",
  "B403",
  "B301",
  "B615",
  "B603",
  "B405",
  "B314",
]
# B501 (verify=False), B602 (shell=True) and B614 (torch.load) are reported: mark an intentional call
# with an inline `# nosec <code>` and a reason instead of skipping the check repo-wide.

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]

[tool.coverage.run]
source = ["tribos", "app"]
omit = ["*/tests/*", "*/test_*", "docs/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "except URLError as e:",
]

[tool.coverage.xml]
output = "coverage.xml"
